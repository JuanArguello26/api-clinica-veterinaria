<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clínica Veterinaria Huellitas</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, Arial, sans-serif; background: #f3f6f9; color: #1f2933; }
    header { background: #0f766e; color: #fff; padding: 18px 24px; }
    header h1 { margin: 0; font-size: 1.5rem; }
    header p { margin: 4px 0 0; opacity: .85; font-size: .9rem; }
    main { max-width: 1100px; margin: 24px auto; padding: 0 16px; display: grid; gap: 20px; grid-template-columns: 360px 1fr; }
    @media (max-width: 850px) { main { grid-template-columns: 1fr; } }
    .card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    h2 { margin-top: 0; font-size: 1.15rem; color: #0f766e; }
    label { display: block; font-size: .85rem; font-weight: 600; margin: 10px 0 4px; }
    input, select { width: 100%; padding: 8px 10px; border: 1px solid #cbd2d9; border-radius: 6px; font-size: .95rem; }
    .check { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
    .check input { width: auto; }
    button { background: #0f766e; color: #fff; border: 0; border-radius: 6px; padding: 10px 14px; font-size: .95rem; cursor: pointer; }
    button:hover { background: #115e59; }
    button.sec { background: #52606d; }
    #btnCrear { width: 100%; margin-top: 16px; }
    .msg { margin-top: 14px; padding: 10px 12px; border-radius: 6px; font-size: .88rem; display: none; }
    .msg.ok { display: block; background: #dcfce7; color: #166534; }
    .msg.err { display: block; background: #fee2e2; color: #991b1b; }
    .msg ul { margin: 6px 0 0; padding-left: 18px; }
    .buscar { display: flex; gap: 8px; margin-bottom: 14px; }
    .buscar input { max-width: 160px; }
    table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #e4e7eb; }
    th { background: #f0fdfa; color: #0f766e; }
    .badge { background: #fef3c7; color: #92400e; padding: 2px 8px; border-radius: 10px; font-size: .78rem; font-weight: 600; }
    .tabla-wrap { overflow-x: auto; }
    .vacio { text-align: center; color: #7b8794; padding: 20px; }
    code { background: #f0f4f8; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>🐾 Clínica Veterinaria Huellitas</h1>
    <p>Gestión de turnos – cliente web que consume la API REST <code style="color:#0f766e">/api/turnos</code></p>
  </header>

  <main>
    <!-- Formulario: POST /api/turnos -->
    <section class="card">
      <h2>Nuevo turno</h2>
      <form id="formTurno">
        <label for="nombreCliente">Nombre del cliente</label>
        <input id="nombreCliente" placeholder="Laura Gómez">

        <label for="nombreMascota">Nombre de la mascota</label>
        <input id="nombreMascota" placeholder="Max">

        <label for="especie">Especie</label>
        <select id="especie">
          <option value="">-- Seleccione --</option>
          <option>Perro</option>
          <option>Gato</option>
          <option>Ave</option>
          <option>Conejo</option>
          <option>Otro</option>
        </select>

        <label for="tipoServicio">Tipo de servicio</label>
        <select id="tipoServicio">
          <option value="">-- Seleccione --</option>
          <option>Consulta general</option>
          <option>Vacunación</option>
          <option>Desparasitación</option>
          <option>Baño y peluquería</option>
          <option>Cirugía menor</option>
          <option>Consulta de urgencia</option>
        </select>

        <label for="fechaHora">Fecha y hora</label>
        <input id="fechaHora" type="datetime-local">

        <label for="precioBase">Precio base (COP)</label>
        <input id="precioBase" type="number" placeholder="80000">

        <div class="check">
          <input id="prioritario" type="checkbox">
          <label for="prioritario" style="margin:0">Atención prioritaria (aplica recargo)</label>
        </div>

        <button id="btnCrear" type="submit">Registrar turno</button>
      </form>
      <div id="msgForm" class="msg"></div>
    </section>

    <!-- Listado: GET /api/turnos y GET /api/turnos/:id -->
    <section class="card">
      <h2>Turnos registrados</h2>
      <div class="buscar">
        <input id="buscarId" type="number" placeholder="Buscar por id">
        <button id="btnBuscar" type="button">Buscar</button>
        <button id="btnTodos" type="button" class="sec">Ver todos</button>
      </div>
      <div id="msgTabla" class="msg"></div>
      <div class="tabla-wrap">
        <table>
          <thead>
            <tr>
              <th>Id</th><th>Cliente</th><th>Mascota</th><th>Servicio</th>
              <th>Fecha</th><th>Precio base</th><th>Recargo</th><th>Total</th>
            </tr>
          </thead>
          <tbody id="cuerpoTabla"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const API = '/api/turnos';
    // Evita que el texto del usuario se interprete como HTML
    const esc = (v) => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const pesos = (n) => '$' + Number(n).toLocaleString('es-CO');

    // Muestra un mensaje de éxito o error (incluye el código HTTP)
    function mostrarMensaje(id, tipo, texto, detalles = []) {
      const caja = document.getElementById(id);
      caja.className = 'msg ' + tipo;
      caja.innerHTML = texto + (detalles.length ? '<ul>' + detalles.map(d => `<li>${esc(d)}</li>`).join('') + '</ul>' : '');
    }

    function ocultarMensaje(id) {
      document.getElementById(id).className = 'msg';
    }

    // Pinta los turnos en la tabla
    function pintarTabla(turnos) {
      const cuerpo = document.getElementById('cuerpoTabla');
      if (turnos.length === 0) {
        cuerpo.innerHTML = '<tr><td colspan="8" class="vacio">Aún no hay turnos registrados</td></tr>';
        return;
      }
      cuerpo.innerHTML = turnos.map(t => `
        <tr>
          <td>${t.id}</td>
          <td>${esc(t.nombreCliente)}</td>
          <td>${esc(t.nombreMascota)} <small>(${esc(t.especie)})</small></td>
          <td>${esc(t.tipoServicio)} ${t.prioritario ? '<span class="badge">Prioritario</span>' : ''}</td>
          <td>${esc(t.fechaHora.replace('T', ' '))}</td>
          <td>${pesos(t.precioBase)}</td>
          <td>${t.porcentajeRecargo}%</td>
          <td><strong>${pesos(t.totalPagar)}</strong></td>
        </tr>`).join('');
    }

    // GET /api/turnos -> 200
    async function cargarTurnos() {
      ocultarMensaje('msgTabla');
      const respuesta = await fetch(API);
      const datos = await respuesta.json();
      pintarTabla(datos);
    }

    // GET /api/turnos/:id -> 200 o 404
    async function buscarPorId() {
      const id = document.getElementById('buscarId').value;
      if (!id) return cargarTurnos();

      const respuesta = await fetch(`${API}/${id}`);
      const datos = await respuesta.json();

      if (respuesta.status === 404) {
        mostrarMensaje('msgTabla', 'err', `<strong>404 Not Found:</strong> ${esc(datos.error)}`);
        pintarTabla([]);
        return;
      }
      mostrarMensaje('msgTabla', 'ok', `<strong>${respuesta.status} OK:</strong> turno encontrado`);
      pintarTabla([datos]);
    }

    // POST /api/turnos -> 201 o 400
    async function crearTurno(evento) {
      evento.preventDefault();

      const valorPrecio = document.getElementById('precioBase').value;
      const turno = {
        nombreCliente: document.getElementById('nombreCliente').value,
        nombreMascota: document.getElementById('nombreMascota').value,
        especie: document.getElementById('especie').value,
        tipoServicio: document.getElementById('tipoServicio').value,
        fechaHora: document.getElementById('fechaHora').value,
        precioBase: valorPrecio === '' ? undefined : Number(valorPrecio),
        prioritario: document.getElementById('prioritario').checked,
      };

      const respuesta = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(turno),
      });
      const datos = await respuesta.json();

      if (respuesta.status === 201) {
        mostrarMensaje('msgForm', 'ok',
          `<strong>201 Created:</strong> turno #${datos.id} registrado. Total a pagar: <strong>${pesos(datos.totalPagar)}</strong>` +
          (datos.prioritario ? ` (incluye ${datos.porcentajeRecargo}% de recargo)` : ''));
        document.getElementById('formTurno').reset();
        cargarTurnos();
      } else {
        mostrarMensaje('msgForm', 'err', `<strong>${respuesta.status} Bad Request:</strong> ${datos.error}`, datos.detalles || []);
      }
    }

    document.getElementById('formTurno').addEventListener('submit', crearTurno);
    document.getElementById('btnBuscar').addEventListener('click', buscarPorId);
    document.getElementById('btnTodos').addEventListener('click', () => {
      document.getElementById('buscarId').value = '';
      cargarTurnos();
    });

    cargarTurnos();
  </script>
</body>
</html>
